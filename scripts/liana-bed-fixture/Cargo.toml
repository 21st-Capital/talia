[package]
name = "liana-bed-fixture"
version = "0.1.0"
edition = "2021"
publish = false
description = "Writes an encrypted descriptor backup (.bed) the way Liana's GUI exports one, for a test fixture."

[dependencies]
# The library Liana wrote .bed backups with up to v15.0, at the exact version
# and features v15.0 pins in its workspace Cargo.toml.
encrypted_backup = { version = "=0.0.2", package = "bitcoin-encrypted-backup", default-features = false, features = ["miniscript_12_0", "rand"] }
# The miniscript release Liana's Cargo.lock resolves (v15.0, the last release
# that wrote .bed files; v16.0 writes .bip138 files and still reads .bed).
miniscript = "=12.3.1"
